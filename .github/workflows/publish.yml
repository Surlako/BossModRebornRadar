name: Publish

on:
  push:
    branches: [main]
    paths: [release-version.txt]
    tags:
      - "*.*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Four-part release version
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:INPUT_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = if ($env:GITHUB_REF_TYPE -eq "tag") {
              $env:GITHUB_REF_NAME
            } else {
              (Get-Content ./release-version.txt -Raw).Trim()
            }
          }
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Release version must have four numeric components."
          }
          "RELEASE_TAG=$version" | Out-File -Append -FilePath $env:GITHUB_ENV
          "version=$version" | Out-File -Append -FilePath $env:GITHUB_OUTPUT

      - name: Verify radar-only boundary
        shell: pwsh
        run: ./scripts/Verify-RadarBoundary.ps1

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud latest
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud-latest.zip
          Expand-Archive -Force dalamud-latest.zip -DestinationPath "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Restore packages
        run: dotnet restore BossMod/BossModReborn.csproj

      - name: Build plugin
        shell: pwsh
        run: dotnet build --no-restore -c Release BossMod/BossModReborn.csproj -p:AssemblyVersion=$env:RELEASE_TAG -p:FileVersion=$env:RELEASE_TAG -p:PackageVersion=$env:RELEASE_TAG -p:InformationalVersion=$env:RELEASE_TAG --output ./build

      - name: Clean package contents
        shell: pwsh
        run: Get-ChildItem ./build/* -Exclude BossModRebornRadar.*,DefaultRotationPresets.json,RebornPresets.json | Remove-Item -Force -Recurse

      - name: Zip plugin
        shell: pwsh
        run: Compress-Archive -Path ./build/* -DestinationPath ./latest.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: ./latest.zip
          generate_release_notes: true
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}

  catalog:
    needs: release
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.release.outputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Update plugin catalog
        shell: pwsh
        run: ./scripts/Update-PluginMaster.ps1 -Version $env:RELEASE_TAG

      - name: Commit catalog update
        shell: pwsh
        run: |
          if (git diff --quiet -- pluginmaster.json) {
            Write-Host "Catalog is already current."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          git commit -m "Update plugin catalog for $env:RELEASE_TAG"
          git push origin main
